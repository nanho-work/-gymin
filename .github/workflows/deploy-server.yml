name: Deploy EC2

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "server/**"
      - "infra/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: gymin-ec2-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_PATH: /opt/gymin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${EC2_HOST:-}" ]; then
            echo "::error::Missing GitHub Actions secret: EC2_HOST"
            exit 1
          fi

          if [ -z "${EC2_SSH_KEY_B64:-}" ] && [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "::error::Missing GitHub Actions secret: EC2_SSH_KEY_B64 or EC2_SSH_KEY"
            exit 1
          fi

          PORT="${EC2_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${EC2_SSH_KEY_B64:-}" ]; then
            printf '%s' "$EC2_SSH_KEY_B64" | base64 --decode > ~/.ssh/gymin_ec2
          else
            printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/gymin_ec2
          fi

          chmod 600 ~/.ssh/gymin_ec2
          ssh-keygen -y -f ~/.ssh/gymin_ec2 >/dev/null

          if ! ssh-keyscan -T 10 -p "$PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Failed to reach EC2 SSH on $EC2_HOST:$PORT. Check EC2 security group inbound SSH rule. GitHub Actions runners are not your local IP."
            exit 1
          fi

      - name: Package deploy files
        run: |
          set -euo pipefail
          tar \
            --exclude='web/node_modules' \
            --exclude='web/.next' \
            --exclude='web/.env' \
            --exclude='web/.env.local' \
            --exclude='server/.venv' \
            --exclude='server/.env' \
            --exclude='server/*firebase*.json' \
            --exclude='server/*service-account*.json' \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            -czf gymin-ec2-deploy.tar.gz web server infra docker-compose.prod.yml

      - name: Upload package to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          if [ -z "${EC2_HOST:-}" ]; then
            echo "::error::Missing GitHub Actions secret: EC2_HOST"
            exit 1
          fi

          PORT="${EC2_PORT:-22}"
          USER_NAME="${EC2_USER:-ec2-user}"
          scp -o BatchMode=yes -o ConnectTimeout=20 -P "$PORT" -i ~/.ssh/gymin_ec2 gymin-ec2-deploy.tar.gz "$USER_NAME@$EC2_HOST:/tmp/gymin-ec2-deploy.tar.gz"

      - name: Deploy on EC2
        env:
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SYNC_NGINX: ${{ secrets.SYNC_NGINX }}
        run: |
          set -euo pipefail
          if [ -z "${EC2_HOST:-}" ]; then
            echo "::error::Missing GitHub Actions secret: EC2_HOST"
            exit 1
          fi

          PORT="${EC2_PORT:-22}"
          USER_NAME="${EC2_USER:-ec2-user}"
          REMOTE_SITE_DOMAIN="${SITE_DOMAIN:-${API_DOMAIN:-_}}"
          REMOTE_SYNC_NGINX="${SYNC_NGINX:-true}"

          ssh -o BatchMode=yes -o ConnectTimeout=20 -p "$PORT" -i ~/.ssh/gymin_ec2 "$USER_NAME@$EC2_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SITE_DOMAIN='$REMOTE_SITE_DOMAIN' SYNC_NGINX='$REMOTE_SYNC_NGINX' bash -s" <<'REMOTE'
          set -euo pipefail

          DEPLOY_PATH="${DEPLOY_PATH:-/opt/gymin}"
          SITE_DOMAIN="${SITE_DOMAIN:-_}"
          SYNC_NGINX="${SYNC_NGINX:-true}"

          sudo mkdir -p "$DEPLOY_PATH" "$DEPLOY_PATH/web" "$DEPLOY_PATH/server" "$DEPLOY_PATH/secrets"
          sudo tar -xzf /tmp/gymin-ec2-deploy.tar.gz -C "$DEPLOY_PATH"
          sudo chown -R "$USER:$USER" "$DEPLOY_PATH"

          if [ ! -f "$DEPLOY_PATH/web/.env" ]; then
            echo "Missing $DEPLOY_PATH/web/.env"
            echo "Create the production web env file on EC2 before deployment."
            exit 1
          fi

          if [ ! -f "$DEPLOY_PATH/server/.env" ]; then
            echo "Missing $DEPLOY_PATH/server/.env"
            echo "Create the production env file on EC2 before deployment."
            exit 1
          fi

          if [ ! -f "$DEPLOY_PATH/secrets/firebase-service-account.json" ]; then
            echo "Missing $DEPLOY_PATH/secrets/firebase-service-account.json"
            echo "Upload the Firebase service account JSON before deployment."
            exit 1
          fi

          chmod 600 "$DEPLOY_PATH/web/.env"
          chmod 600 "$DEPLOY_PATH/server/.env"
          chmod 644 "$DEPLOY_PATH/secrets/firebase-service-account.json"

          set -a
          . "$DEPLOY_PATH/web/.env"
          set +a

          if sudo docker compose version >/dev/null 2>&1; then
            COMPOSE="sudo docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="sudo docker-compose"
          else
            echo "Docker Compose is not installed on EC2."
            exit 1
          fi

          $COMPOSE -f "$DEPLOY_PATH/docker-compose.prod.yml" up -d --build
          $COMPOSE -f "$DEPLOY_PATH/docker-compose.prod.yml" ps

          if [ "$SYNC_NGINX" != "false" ]; then
            if ! command -v nginx >/dev/null 2>&1; then
              echo "Nginx is not installed on EC2."
              exit 1
            fi

            tmp_conf="$(mktemp)"
            sed "s/__API_DOMAIN__/${SITE_DOMAIN}/g" "$DEPLOY_PATH/infra/nginx/gymin-api.conf" > "$tmp_conf"
            sudo install -m 0644 "$tmp_conf" /etc/nginx/conf.d/gymin-api.conf
            rm -f "$tmp_conf"

            sudo nginx -t
            sudo systemctl reload nginx || sudo systemctl restart nginx
          fi
          REMOTE
