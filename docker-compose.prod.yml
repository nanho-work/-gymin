name: gymin

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gymin-api
    restart: unless-stopped
    env_file:
      - /opt/gymin/server/.env
    volumes:
      - /opt/gymin/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
